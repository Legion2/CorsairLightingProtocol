on: [push, pull_request, workflow_dispatch]
name: Test

# All tool and dependency versions live in this block. Dependabot does not track
# Arduino cores or libraries, so a version bump is a one-line change here.
# The FastLED versions are repeated in the job matrices because the env context
# is not available in strategy.matrix.
env:
  ARDUINO_AVR: "1.8.8"
  SPARKFUN_AVR: "1.1.13"
  HOODLOADER2_AVR: "2.0.5"
  ADAFRUIT_SAMD: "1.7.17"
  ADAFRUIT_NRF52: "1.7.0"
  RP2040: "6.0.0"
  TINYUSB: "3.7.7"
  # Only the Leonardo entry of CLP Boards 0.3.1 works with arduino-cli >= 0.19; its
  # Pro Micro entries reference the SparkFun variant of another platform, see
  # https://github.com/Legion2/CorsairLightingProtocolBoards/issues/20
  CLP_BOARDS: "0.3.1"
  URL_SPARKFUN: https://raw.githubusercontent.com/sparkfun/Arduino_Boards/master/IDE_Board_Manager/package_sparkfun_index.json
  URL_CLP_BOARDS: https://raw.githubusercontent.com/Legion2/CorsairLightingProtocolBoards/master/package_Legion2_CorsairLightingProtocolBoards_index.json
  URL_HOODLOADER2: https://raw.githubusercontent.com/NicoHood/HoodLoader2/master/package_NicoHood_HoodLoader2_index.json
  URL_ADAFRUIT: https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
  URL_RP2040: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
  AVR_SKETCHES: LightingNodePRO.ino,SingleStripLightingNodePRO.ino,CommanderPRO.ino,DeviceIDTool.ino,RepeatAndScale.ino,TransformLLFansFormatToStrip.ino,LS100.ino,LT100.ino,LightingNodeCORE.ino,NonAddressable.ino,AdditionalFeatures.ino,AmbientBacklight.ino,MultipleFans.ino,DebugSketch.ino,NoEEPROM.ino
  DEBUG_SKETCH_FLAGS: '{"DebugSketch": "-DDEBUG -DVERBOSE -DPRINT_COMMAND=true -DPRINT_RESPONSE=true -DPRINT_LOOP=true -DPRINT_UPDATE=true"}'

jobs:
  testAVR:
    name: AVR ${{ matrix.board }} with FastLED ${{ matrix.fastled }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - arduino:avr:leonardo
          - SparkFun:avr:promicro:cpu=16MHzatmega32U4
          - SparkFun:avr:promicro:cpu=8MHzatmega32U4
        fastled: ["3.5.0", "3.10.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_SPARKFUN }}
          arduino-platform: arduino:avr@${{ env.ARDUINO_AVR }},SparkFun:avr@${{ env.SPARKFUN_AVR }}
          required-libraries: FastLED@${{ matrix.fastled }}
          sketch-names: ${{ env.AVR_SKETCHES }}
          build-properties: ${{ env.DEBUG_SKETCH_FLAGS }}

  testCLPBoards:
    name: CLP Boards ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - Legion2:avr:leonardoclp:device=lnp
          - Legion2:avr:leonardoclp:device=cp
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_CLP_BOARDS }}
          arduino-platform: arduino:avr@${{ env.ARDUINO_AVR }},Legion2:avr@${{ env.CLP_BOARDS }}
          required-libraries: FastLED@3.10.5
          sketch-names: LightingNodePRO.ino,CommanderPRO.ino

  testUnoMega:
    name: ${{ matrix.board }} with FastLED ${{ matrix.fastled }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["arduino:avr:uno", "arduino:avr:mega:cpu=atmega2560"]
        fastled: ["3.5.0", "3.10.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          arduino-platform: arduino:avr@${{ env.ARDUINO_AVR }}
          required-libraries: FastLED@${{ matrix.fastled }}
          sketch-names: HoodLoader2UnoMegaController.ino

  test16u2:
    name: ${{ matrix.board }} with FastLED ${{ matrix.fastled }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["HoodLoader2:avr:HoodLoader2atmega16u2"]
        fastled: ["3.5.0", "3.10.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_HOODLOADER2 }}
          arduino-platform: arduino:avr@${{ env.ARDUINO_AVR }},HoodLoader2:avr@${{ env.HOODLOADER2_AVR }}
          required-libraries: FastLED@${{ matrix.fastled }}
          sketch-names: HoodLoader2CLPBridge.ino

  testAdafruitSAMD:
    name: ${{ matrix.board }} with FastLED ${{ matrix.fastled }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - "adafruit:samd:adafruit_feather_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_metro_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_circuitplayground_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_gemma_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_trinket_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_qtpy_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_itsybitsy_m0:usbstack=tinyusb"
          - "adafruit:samd:adafruit_itsybitsy_m4:usbstack=tinyusb"
          - "adafruit:samd:adafruit_metro_m4_airliftlite:usbstack=tinyusb"
          # "adafruit:samd:adafruit_feather_m4:usbstack=tinyusb" should work but doesn't have the pins needed for the sketch
          - "adafruit:samd:adafruit_matrixportal_m4:usbstack=tinyusb"
        fastled: ["3.5.0", "3.10.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_ADAFRUIT }}
          arduino-platform: adafruit:samd@${{ env.ADAFRUIT_SAMD }}
          required-libraries: FastLED@${{ matrix.fastled }},Adafruit TinyUSB Library@${{ env.TINYUSB }}
          sketch-names: TinyUSB.ino

  testAdafruitnRF52:
    name: ${{ matrix.board }} with FastLED ${{ matrix.fastled }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - "adafruit:nrf52:feather52840"
          - "adafruit:nrf52:itsybitsy52840"
          # "adafruit:nrf52:cplaynrf52840" should work but doesn't have the pins needed for the sketch
          - "adafruit:nrf52:metro52840"
        fastled: ["3.5.0", "3.10.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Get adafruit-nrfutil
        run: pip3 install adafruit-nrfutil --user
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_ADAFRUIT }}
          arduino-platform: adafruit:nrf52@${{ env.ADAFRUIT_NRF52 }}
          required-libraries: FastLED@${{ matrix.fastled }},Adafruit TinyUSB Library@${{ env.TINYUSB }}
          sketch-names: TinyUSB.ino

  testRP2040:
    # FastLED supports the RP2040 since 3.6.0, so there is no 3.5.0 entry here.
    # arduino-pico ships its own copy of the Adafruit TinyUSB library; installing
    # the library separately would shadow the version that matches the core.
    name: ${{ matrix.board }} with FastLED 3.10.5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - "rp2040:rp2040:rpipico:usbstack=tinyusb"
          - "rp2040:rp2040:rpipico2:usbstack=tinyusb"
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.board }}
        uses: ArminJo/arduino-test-compile@v3
        with:
          arduino-board-fqbn: ${{ matrix.board }}
          platform-url: ${{ env.URL_RP2040 }}
          arduino-platform: rp2040:rp2040@${{ env.RP2040 }}
          required-libraries: FastLED@3.10.5
          sketch-names: TinyUSB.ino
